name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check src tests

      - name: Type check (mypy)
        run: mypy src

      - name: Offline test suite (pytest + coverage)
        run: pytest --cov=s1shell --cov-report=term-missing

  build-and-smoke:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distribution packages
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*

      - name: Wheel install smoke test
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/s1shell --version
          /tmp/smoke-venv/bin/s1shell doctor --home /tmp/smoke-home
          /tmp/smoke-venv/bin/s1shell ai skills list --format json > /dev/null
          /tmp/smoke-venv/bin/s1shell mcp config http > /dev/null
          /tmp/smoke-venv/bin/s1shell tor status --format json > /dev/null
          /tmp/smoke-venv/bin/s1shell completion bash > /dev/null
          cat <<'EOF' > /tmp/smoke_profile.json
          {
            "schema_version": "1.0",
            "tool_version": "0.4.2",
            "generated_at_utc": "2026-11-20T00:00:00Z",
            "artifact_type": "profile_report",
            "target": "https://app.example.com",
            "url": "https://app.example.com/",
            "pinned_ip": "93.184.216.34",
            "scope_id": "smoke001",
            "auth_ref": "SMOKE-1",
            "raw_headers": [["Server", "nginx/1.24.0"]],
            "dns": {"a": ["93.184.216.34"], "aaaa": [], "cname": [], "errors": []},
            "tls": {"applicable": true, "issuer": "CN=Let's Encrypt"}
          }
          EOF
          /tmp/smoke-venv/bin/s1shell fingerprint --from-profile /tmp/smoke_profile.json --format json > /dev/null
