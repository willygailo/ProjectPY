[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "s1shell"
version = "0.2.0"
description = "Open-source CLI toolkit for authorized CVE research, scoped target profiling, passive fingerprinting, and reporting."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "S1shell Contributors" },
]
keywords = ["security", "cve", "tls", "assessment", "kali", "defensive"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "httpx[http2]>=0.27.0",
  "dnspython>=2.6.0",
  "cryptography>=42.0.0",
  "rich>=13.7.0",
  "PyYAML>=6.0.1",
  "jinja2>=3.1.3",
]

[project.urls]
Homepage = "https://github.com/s1shell/s1shell"
Repository = "https://github.com/s1shell/s1shell"
Issues = "https://github.com/s1shell/s1shell/issues"
Changelog = "https://github.com/s1shell/s1shell/blob/main/CHANGELOG.md"
Security = "https://github.com/s1shell/s1shell/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "build>=1.2",
  "twine>=5.0",
]

[project.scripts]
s1shell = "s1shell.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
s1shell = [
  "fingerprint/*.yaml",
  "report/templates/*.j2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["s1shell"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = [
  "S101",  # pytest uses assert
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true
