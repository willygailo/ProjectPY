    <text x="2" y="38" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="21" font-weight="500" fill="#cbd5e1">
      Authorized Defensive Security Assessment, OSINT &amp; AppSec CLI Toolkit
    </text>
    <text x="2" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="14.5" fill="#94a3b8">
      Built for Kali Linux &amp; Linux · Fail-Closed Scope Gate · Read-Only Profiling · SARIF 2.1.0
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="194" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.2"/>
      <circle cx="18" cy="16" r="4" fill="#38bdf8"/>
      <text x="30" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#e2e8f0">Fail-Closed Scope Gate</text>

      <rect x="208" y="0" width="188" height="32" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.2"/>
      <circle cx="226" cy="16" r="4" fill="#22d3ee"/>
      <text x="238" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#e2e8f0">7-Feed Passive Intel</text>

      <rect x="410" y="0" width="194" height="32" rx="16" fill="#0f172a" stroke="#34d399" stroke-opacity="0.55" stroke-width="1.2"/>
      <circle cx="428" cy="16" r="4" fill="#34d399"/>
      <text x="440" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#e2e8f0">Online HTTP + Stdio MCP</text>

      <rect x="618" y="0" width="214" height="32" rx="16" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.2"/>
      <circle cx="636" cy="16" r="4" fill="#a78bfa"/>
      <text x="648" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#e2e8f0">9 AI Skills &amp; Tor SOCKS5h</text>
